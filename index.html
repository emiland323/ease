<style>

*{box-sizing:border-box}

nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}

</div>
<script>

const TAGS=["Poor sleep","Caffeine","Work","Money","Health","Relationships","Crowds","Nothing clear"];
const MOODS=["Very low","Low","Okay","Good","Great"];

const ACTS=[

["Move","Shake it out","2 min","Shake your hands, arms, then legs loosely for a minute. Let your body be silly."],

["Outdoors","Step outside","5 min","Get some daylight and name three things you notice: a sound, a color, a smell."],
["Outdoors","Sit near green or water","10 min","A park bench, a tree, or a window with a view all count."],
["Hands-on","Warm shower","10 min","Let the warmth loosen your shoulders. Notice the sound and feel of the water."],
["Hands-on","Tea, slowly","5 min","Make a warm drink and finish it with no screen. Feel the cup in your hands."],

  const card=(a,hl)=>el("div",{class:"card",style:hl?"border:2px solid var(--accent)":""},el("strong",{},a[1]),el("small",{style:"margin-left:8px"},a[2]),el("p",{},a[3]),el("button",{class:"chip",style:"margin-top:10px",onclick:e=>{logIt("Activity",a[1]);e.currentTarget.textContent="Logged for today";e.currentTarget.disabled=true}},"I did this"));

const QUOTES=[["We suffer more often in imagination than in reality.","Seneca"],["The soul becomes dyed with the color of its thoughts.","Marcus Aurelius"],["It is not things that disturb us, but our judgments about things.","Epictetus"],["Very little is needed to make a happy life.","Marcus Aurelius"],["Begin at once to live, and count each separate day as a separate life.","Seneca"],["No man is free who is not master of himself.","Epictetus"]];

const MEDS=[
{n:"Body scan",d:"Move attention slowly from head to toe.",p:["Settle in. Let your eyes close, or soften your gaze.","Notice your forehead and jaw. Let them loosen.","Let your neck and shoulders drop.","Feel your arms and hands. Let them get heavy.","Notice your chest rising and falling.","Soften your belly. No need to hold it in.","Feel your hips, legs, and feet resting.","Take in your whole body at once. Rest here."]},
